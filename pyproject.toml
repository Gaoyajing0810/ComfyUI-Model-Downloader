[project]
name = "comfy-ui-model-downloader"
version = "0.1.13"
description = "ComfyUI Model Downloader —— 解析 ComfyUI 工作流所需模型，从 ModelScope 魔搭社区下载到本地模型目录并校验完整性"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "click>=8.1",
    "httpx>=0.27",
    "modelscope>=1.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
comfy-ui-model-downloader = "comfy_model_downloader.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["comfy_model_downloader"]

[tool.setuptools.package-data]
comfy_model_downloader = ["web/*", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
